[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multivision"
version = "0.1.0"
description = "Camera calibration and projector overlay service"
requires-python = ">=3.11"
dependencies = [
    "opencv-python-headless==4.11.0.86",
    "pygame==2.6.1",
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[project.scripts]
multivision = "multivision.cli:main"
multivision-server = "multivision.main:main"

[tool.setuptools.packages.find]
include = ["multivision*"]
