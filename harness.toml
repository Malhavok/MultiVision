# Runtime 0.4 configuration for pi-harness.

[globals]
timeout_minutes = 10
max_attempts = 5
timeout_threshold = 2
heartbeat_interval_minutes = 30

[implementation.models]
low_tier = "openai-codex/gpt-5.6-luna"
mid_tier = "openai-codex/gpt-5.6-terra"
high_tier = "openai-codex/gpt-5.6-sol"

[review]
passes = 1

[review.pyra.models]
low_tier = "openai-codex/gpt-5.6-luna"
mid_tier = "openai-codex/gpt-5.6-terra"
high_tier = "openai-codex/gpt-5.6-sol"

[review.mythra.models]
low_tier = "openai-codex/gpt-5.6-luna"
mid_tier = "openai-codex/gpt-5.6-terra"
high_tier = "openai-codex/gpt-5.6-sol"

[cleanup]
passes = 3
